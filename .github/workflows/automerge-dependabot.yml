name: Automerge Dependabot PRs

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    contents: write
    pull-requests: write

jobs:
    automerge:
        uses: ioBroker/testing-action-automerge-dependabot@v1
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
